<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MacOS Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="28" height="28">
    <div>
      <h1>MacOS Download Manager</h1>
      <p id="status" class="status">Checking connection…</p>
    </div>
  </header>

  <label class="row">
    <input type="checkbox" id="enabled">
    <span>Take over browser downloads</span>
  </label>

  <section class="video">
    <button id="video" class="wide">▶︎ Download video from this page</button>
    <p class="muted small">YouTube, Facebook, TikTok, Vimeo… – choose the quality in the app.</p>
  </section>

  <section id="last" hidden>
    <h2>Last download</h2>
    <p id="lastText" class="muted"></p>
  </section>

  <section>
    <h2>Media on this page</h2>
    <ul id="media"></ul>
    <p id="empty" class="muted">No video or audio detected yet. Start playing the video, then open this panel again.</p>
  </section>

  <footer>
    <button id="options">Settings</button>
    <span id="version" class="muted small"></span>
    <a href="https://github.com/xuanthanhtnt/MacOS-Download-Manager" target="_blank" rel="noopener">GitHub</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>

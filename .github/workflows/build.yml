name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit & integration tests
        run: |
          FIXTURES="$RUNNER_TEMP/mdm-fixtures"
          ./scripts/test_fixtures.sh "$FIXTURES"
          python3 scripts/test_server.py "$FIXTURES" 8765 &
          SERVER_PID=$!
          sleep 1
          export MDM_TEST_SERVER="http://127.0.0.1:8765"
          export MDM_TEST_FIXTURES="$FIXTURES"
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          kill $SERVER_PID || true
          grep -E "Test Case .*(passed|failed|skipped)|error:" test.log | tail -40
          # Surface failures as annotations (readable through the API without log access)
          grep -E "error:|failed \(|XCTAssert" test.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "Test Case .*(passed|skipped)" test.log | sed 's/^/::notice::/' | head -30
          exit $status

      - name: Build MacOS Download Manager.app and DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="$(cat VERSION)"
          fi
          export BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          set -o pipefail
          ./scripts/build_app.sh 2>&1 | tee build.log || {
            grep -E "error:" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-Download-Manager-dmg
          path: |
            build/*.dmg
            build/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/*.dmg build/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.dmg build/*.sha256 \
              --title "MacOS Download Manager ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi

name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit & integration tests
        run: |
          FIXTURES="$RUNNER_TEMP/mdm-fixtures"
          ./scripts/test_fixtures.sh "$FIXTURES"
          python3 scripts/test_server.py "$FIXTURES" 8765 &
          SERVER_PID=$!
          sleep 1
          export MDM_TEST_SERVER="http://127.0.0.1:8765"
          export MDM_TEST_FIXTURES="$FIXTURES"
          export MDM_NETWORK_TESTS=1
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          kill $SERVER_PID || true
          grep -E "Test Case .*(passed|failed|skipped)|error:" test.log | tail -40
          # Surface failures as annotations (readable through the API without log access)
          grep -E "error:|failed \(|XCTAssert" test.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "MDM-NOTE|skipped" test.log | sed 's/^/::notice title=Test note::/' | head -10
          grep -E "Test Case .*passed" test.log | wc -l | sed 's/^/::notice title=Passed tests::/'
          exit $status

      - name: Build MacOS Download Manager.app and DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="$(cat VERSION)"
          fi
          export BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          set -o pipefail
          ./scripts/build_app.sh 2>&1 | tee build.log || {
            grep -E "error:" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Smoke test (launch the app, check the main thread)
        run: ./scripts/smoke_test.sh

      - name: Browser extension test (Chromium)
        run: |
          FIXTURES="$RUNNER_TEMP/mdm-ext-fixtures"
          ./scripts/test_fixtures.sh "$FIXTURES"
          python3 scripts/test_server.py "$FIXTURES" 8766 > "$RUNNER_TEMP/ext-server.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do curl -s -o /dev/null "http://127.0.0.1:8766/page" && break; sleep 0.5; done
          echo "::notice title=Test server check::$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8766/page?href=/files/big.bin')"
          cd Tests/extension
          npm install --no-audit --no-fund --loglevel=error
          set +e
          MDM_HEADLESS=1 MDM_TEST_SERVER=http://127.0.0.1:8766 node test_extension.mjs 2>&1 | tee ext-test.log
          status=${PIPESTATUS[0]}
          # One note with every check (GitHub keeps at most 10 notes per step).
          echo "::notice title=Extension checks::$(grep -E '^(✔|✘)|self-update' ext-test.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          kill $SERVER_PID || true
          exit $status

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-Download-Manager-dmg
          path: |
            build/*.dmg
            build/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        # A release is created automatically for every new version in the VERSION file
        # (or when a v* tag is pushed). Existing releases are left untouched.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(cat VERSION)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists – bump VERSION to publish a new one."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$TAG" build/*.dmg build/*.sha256 --clobber
            fi
          else
            gh release create "$TAG" build/*.dmg build/*.sha256 \
              --target "$GITHUB_SHA" \
              --title "MacOS Download Manager ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

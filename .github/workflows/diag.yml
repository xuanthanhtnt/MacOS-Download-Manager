name: Diagnose DASH joining
on:
  push:
    branches: ["diag/**"]
jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install ffmpeg deno >/dev/null 2>&1 || true
          which ffmpeg deno
          curl -sSL -o ytdlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos && chmod +x ytdlp && ./ytdlp --version
      - name: Make files
        run: |
          mkdir -p f && cd f
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 12 -c:v libx264 -g 30 -pix_fmt yuv420p -c:a aac src.mp4
          ffmpeg -v error -i src.mp4 -an -c copy plain_v.mp4
          ffmpeg -v error -i src.mp4 -vn -c copy plain_a.m4a
          ffmpeg -v error -i src.mp4 -an -c copy -movflags +frag_keyframe+empty_moov+default_base_moof frag_v.mp4
          ffmpeg -v error -i src.mp4 -vn -c copy -movflags +frag_keyframe+empty_moov+default_base_moof frag_a.m4a
          ffmpeg -v error -i src.mp4 -an -c copy -movflags +frag_keyframe+empty_moov+default_base_moof+global_sidx+dash fragsidx_v.mp4 || true
          mkdir -p dv da
          ffmpeg -v error -i src.mp4 -map 0:v -c copy -f dash -single_file 1 dv/m.mpd || true
          ffmpeg -v error -i src.mp4 -map 0:a -c copy -f dash -single_file 1 da/m.mpd || true
          ls -la dv da
          cp dv/*stream0*.mp4 dash_v.mp4 2>/dev/null || cp "$(ls dv/*.m4s dv/*.mp4 2>/dev/null | head -1)" dash_v.mp4 || true
          cp da/*stream0*.mp4 dash_a.m4a 2>/dev/null || cp "$(ls da/*.m4s da/*.mp4 2>/dev/null | head -1)" dash_a.m4a || true
          for x in frag_v.mp4 dash_v.mp4; do [ -f $x ] && cp $x brand_$x && printf 'dash' | dd of=brand_$x bs=1 seek=8 conv=notrunc 2>/dev/null; done
          for x in frag_a.m4a dash_a.m4a; do [ -f $x ] && cp $x brand_$x && printf 'dash' | dd of=brand_$x bs=1 seek=8 conv=notrunc 2>/dev/null; done
          ls -la
      - name: Real YouTube streams
        continue-on-error: true
        run: |
          set +e
          cd f
          for v in dMwX6nGufOw jNQXAC9IVRw; do
            for t in 1 2 3; do
              ../ytdlp --no-warnings --js-runtimes deno -J "https://www.youtube.com/watch?v=$v" > $v.json 2> $v.err && break
              sleep 5
            done
            if [ -s $v.json ]; then python3 ../diag/formats.py $v.json choice_$v.txt > fmt_$v.txt; else tail -2 $v.err > fmt_$v.txt; fi
            echo "::notice title=Formats $v::$(perl -pe 's/\n/%0A/' fmt_$v.txt)"
          done
          if [ -s choice_jNQXAC9IVRw.txt ]; then
            read V A < choice_jNQXAC9IVRw.txt
            ../ytdlp --no-warnings --js-runtimes deno --ffmpeg-location /nonexistent -f "$V" -o "yt_v.%(ext)s" "https://www.youtube.com/watch?v=jNQXAC9IVRw" > dl.log 2>&1 || true
            ../ytdlp --no-warnings --js-runtimes deno --ffmpeg-location /nonexistent -f "$A" -o "yt_a.%(ext)s" "https://www.youtube.com/watch?v=jNQXAC9IVRw" >> dl.log 2>&1 || true
            ls -la yt_* >> dl.log 2>&1 || true
            for x in yt_v.* yt_a.*; do [ -f "$x" ] && echo "$x first bytes: $(xxd -l 12 -p "$x")" >> dl.log; done
            echo "::notice title=App choice download ($V + $A)::$(perl -pe 's/\n/%0A/' dl.log)"
          fi
          true
      - name: Probe
        run: |
          cd f
          swiftc -O ../diag/probe.swift -o probe
          python3 ../diag/boxes.py $(ls yt_*.mp4 yt_*.m4a 2>/dev/null) > ../boxes.txt || true
          ./probe frag_v.mp4 dash_a.m4a > ../probe.txt 2>&1
          V=$(ls yt_v.* 2>/dev/null | head -1); A=$(ls yt_a.* 2>/dev/null | head -1)
          [ -n "$V" ] && ./probe "$V" "$A" >> ../probe.txt 2>&1
          [ -n "$V" ] && [ -n "$A" ] && ./probe merge "$V" "$A" m4.mp4 >> ../probe.txt 2>&1
          echo "::notice title=AVFoundation::$(perl -pe 's/\n/%0A/' ../probe.txt)"
          echo "::notice title=YouTube boxes::$(perl -pe 's/\n/%0A/' ../boxes.txt)"
          true

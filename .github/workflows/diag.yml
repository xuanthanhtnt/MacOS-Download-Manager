name: Diagnose yt-dlp start-up
on:
  push:
    branches: ["diag/**"]
jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Measure
        run: |
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          curl -sSL -o ytdlp_onefile $base/yt-dlp_macos && chmod +x ytdlp_onefile
          curl -sSL -o onedir.zip $base/yt-dlp_macos.zip && mkdir onedir && ditto -x -k onedir.zip onedir
          ls onedir | head; du -sh onedir ytdlp_onefile
          EXE=$(find onedir -maxdepth 2 -type f -perm -u+x -name 'yt-dlp*' | head -1); echo "exe=$EXE"
          t() { local s=$(python3 -c 'import time;print(time.time())'); "$@" > /dev/null 2>&1; python3 -c "import time;print(round(time.time()-$s,2))"; }
          {
            echo "onefile --version: $(t ./ytdlp_onefile --version) $(t ./ytdlp_onefile --version) $(t ./ytdlp_onefile --version) s"
            echo "onedir  --version: $(t $EXE --version) $(t $EXE --version) $(t $EXE --version) s"
            echo "onedir version: $($EXE --version)"
            echo "onedir -U: $($EXE -U 2>&1 | tail -1)"
          } > ../m.txt
          echo "::notice title=yt-dlp start-up::$(perl -pe 's/\n/%0A/' ../m.txt)"
